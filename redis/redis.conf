# Konfiguruje Redis tak, aby nasłuchiwał na wszystkich interfejsach sieciowych, umożliwiając zdalny dostęp z dowolnego adresu IP.
bind redis

# Wyłącza tryb ochronny, co pozwala na dostęp z dowolnego adresu, nie tylko lokalnego hosta.
protected-mode no

# Ustawia port, na którym Redis odbiera połączenia klientów (domyślnie 6379).
port 6379

# Określa maksymalną liczbę oczekujących połączeń w kolejce TCP, co umożliwia obsługę dużego natężenia ruchu.
tcp-backlog 511

# Ustawia brak limitu czasu połączenia, wyłączając automatyczne rozłączanie klientów z powodu braku aktywności.
timeout 0

# Włącza mechanizm TCP keepalive z interwałem 300 sekund, aby wykrywać zerwane lub martwe połączenia.
tcp-keepalive 300

# Wyłącza tryb nadzorowany (supervised), czyli Redis nie jest zarządzany przez zewnętrzny system nadzorujący (np. systemd).
supervised no

# Ustawia poziom logowania na 'verbose' (szczegółowy), co generuje bogate logi operacyjne.
loglevel verbose

# Konfiguruje tworzenie migawki (snapshotu) do dysku: Redis zapisze dane, gdy w ciągu 30 sekund zmieni się co najmniej jeden klucz.
save 30 1

# Włącza tryb AOF (Append Only File) dla trwałego zapisu każdej operacji modyfikującej dane.
appendonly yes

# Wymusza wykonanie synchronizacji zapisu (fsync) na dysk po każdej operacji, maksymalizując trwałość danych.
appendfsync always


